<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENITUS DIVIDEND ANALYSIS</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#f4f7fb;--surface:#ffffff;--panel:#ffffff;--border:#d9e2ec;--accent:#0e7490;--gold:#b45309;--green:#15803d;--red:#b91c1c;--muted:#52606d;--text:#1e293b;--bright:#0f172a;--mono:'Space Mono',monospace;--sans:'Rajdhani',sans-serif;}
    :root.dark-theme{--bg:#080c10;--surface:#0d1117;--panel:#111820;--border:#1e2d3d;--accent:#00d4ff;--gold:#f0c040;--green:#00ff88;--red:#ff3b5c;--muted:#7d92a8;--text:#c8d8e8;--bright:#ffffff;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;min-height:100vh;transition:background .25s,color .25s;}

    header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:200;}
    .logo{display:flex;align-items:center;gap:12px;}
    .logo-mark{width:32px;height:32px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;color:var(--gold);}
    .logo-text{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--bright);}
    .logo-sub{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);display:block;margin-top:1px;}
    #themeToggleBtn{background:none;border:1px solid var(--border);color:var(--accent);width:30px;height:30px;border-radius:2px;cursor:pointer;font-size:14px;}

    .layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 56px);}
    @media(max-width:900px){.layout{grid-template-columns:1fr;}}

    .picker-panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;overflow-y:auto;max-height:calc(100vh - 56px);}
    .field-label{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block;}
    select,input[type="text"]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 10px;outline:none;border-radius:2px;}
    select:focus,input:focus{border-color:var(--accent);}
    .picker-list{flex:1;overflow-y:auto;border:1px solid var(--border);border-radius:2px;min-height:200px;}
    .picker-item{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12px;}
    .picker-item:hover,.picker-item.active{background:rgba(180,83,9,0.08);}
    .picker-item .sym{font-family:var(--mono);color:var(--accent);font-weight:700;}
    .picker-item .nm{color:var(--muted);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .picker-empty{padding:30px 10px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;}

    .main-panel{padding:18px;overflow-y:auto;}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;color:var(--muted);font-family:var(--mono);font-size:12px;gap:10px;text-align:center;}
    .welcome .big{font-size:32px;opacity:.4;}

    .analysis-title{font-family:var(--mono);font-size:16px;color:var(--gold);letter-spacing:1px;margin-bottom:14px;}
    .stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px;}
    @media(max-width:900px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:500px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
    .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:10px;}
    .stat-box .lbl{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:5px;}
    .stat-box .val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--bright);}
    .stat-box .val.up{color:var(--green);} .stat-box .val.down{color:var(--red);}

    .panel-block{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:14px;margin-bottom:16px;}
    .panel-block h3{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
    .chart-wrap{height:280px;position:relative;}
    .panel-block p.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.6;}

    .yoc-controls{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px;}
    .yoc-result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    @media(max-width:600px){.yoc-result{grid-template-columns:repeat(2,1fr);}}
    .btn{font-family:var(--mono);font-size:11px;letter-spacing:1px;padding:8px 12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;border-radius:2px;text-transform:uppercase;}
    .btn:hover{background:var(--gold);color:var(--bg);}
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">Σ</div>
    <div><span class="logo-text">GENITUS</span><span class="logo-sub">DIVIDEND ANALYSIS</span></div>
  </div>
  <button id="themeToggleBtn" title="Toggle theme">🌙</button>
</header>

<div class="layout">
  <div class="picker-panel">
    <div>
      <span class="field-label">Exchange</span>
      <select id="exchangeSelect" onchange="onExchangeChange()"></select>
    </div>
    <div>
      <span class="field-label">Search Symbol / Name</span>
      <input type="text" id="searchInput" placeholder="e.g. GSK, Shell..." oninput="renderPicker()">
    </div>
    <div class="picker-list" id="pickerList"><div class="picker-empty">Select an exchange to list its confirmed payers.</div></div>
  </div>

  <div class="main-panel" id="mainPanel">
    <div class="welcome">
      <div class="big">Σ</div>
      <div>Pick a symbol on the left.<br>Everything here runs on the already-verified cache — no live API calls.</div>
    </div>
  </div>
</div>

<script>
  const SUMMARY_URL = 'https://raw.githubusercontent.com/Babybounce500/genitus-ticker-cache/main/dividend-summary.csv';
  const HISTORY_URL = 'https://raw.githubusercontent.com/Babybounce500/genitus-ticker-cache/main/dividend-history.csv';

  (function(){
    const KEY='genitusTheme:divanalysis';
    function applyTheme(t){
      document.documentElement.classList.toggle('dark-theme', t==='dark');
      localStorage.setItem(KEY,t);
      const btn=document.getElementById('themeToggleBtn');
      if(btn) btn.textContent = t==='dark' ? '☀' : '🌙';
    }
    window.__theme = localStorage.getItem(KEY) || 'light';
    applyTheme(window.__theme);
    document.addEventListener('DOMContentLoaded', function(){
      const btn=document.getElementById('themeToggleBtn');
      if(btn) btn.addEventListener('click', function(){
        window.__theme = window.__theme==='dark' ? 'light' : 'dark';
        applyTheme(window.__theme);
      });
    });
  })();

  function parseCSVLine(line){
    const out=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(inQ){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
      else { if(c===','){ out.push(cur); cur=''; } else if(c==='"'){ inQ=true; } else cur+=c; }
    }
    out.push(cur); return out;
  }

  let summaryByExchange = new Map();   // ex -> [{fullSymbol,name,type,count,streakYears,streakDir,yieldPct,price,lastDate,lastAmount,lastCurrency}]
  let historyBySymbol = new Map();     // fullSymbol -> [{date,value,currency,price,pctOfPrice}]
  let cacheReady = null;

  function loadCache(){
    if(cacheReady) return cacheReady;
    cacheReady = Promise.all([
      fetch(SUMMARY_URL).then(r=>r.text()),
      fetch(HISTORY_URL).then(r=>r.text())
    ]).then(([sText,hText])=>{
      const sLines = sText.split('\n').filter(Boolean);
      for(let i=1;i<sLines.length;i++){
        const [fullSymbol,name,type,ex,count,streakYears,streakDir,yieldPct,price,lastDate,lastAmount,lastCurrency] = parseCSVLine(sLines[i]);
        if(!fullSymbol||!ex) continue;
        if(!summaryByExchange.has(ex)) summaryByExchange.set(ex, []);
        summaryByExchange.get(ex).push({
          fullSymbol, name:(name||'').trim(), type, ex,
          count: parseInt(count)||0, streakYears: parseInt(streakYears)||1, streakDir: streakDir||'new',
          yieldPct: (parseFloat(yieldPct)||0)>50?0:(parseFloat(yieldPct)||0), price: price?parseFloat(price):null,
          lastDate: lastDate||'', lastAmount: parseFloat(lastAmount)||0, lastCurrency: lastCurrency||''
        });
      }
      const hLines = hText.split('\n').filter(Boolean);
      for(let i=1;i<hLines.length;i++){
        const [fullSymbol,date,amount,currency,price,pct] = parseCSVLine(hLines[i]);
        if(!fullSymbol) continue;
        if(!historyBySymbol.has(fullSymbol)) historyBySymbol.set(fullSymbol, []);
        historyBySymbol.get(fullSymbol).push({ date, value:parseFloat(amount)||0, currency:currency||'', price: price?parseFloat(price):null, pctOfPrice: pct?parseFloat(pct):null });
      }
      console.log(`Loaded ${summaryByExchange.size} exchanges, ${sLines.length-1} payers, ${hLines.length-1} payment records.`);
    }).catch(e=>console.warn('Cache load failed:', e.message));
    return cacheReady;
  }

  const EXCHANGES = [
    {g:'🇺🇸 United States',opts:['US','NYSE','NASDAQ','AMEX','PINK','OTCQB','OTCQX','BATS']},
    {g:'🇨🇦 Canada',opts:['TO','V','NEO']},
    {g:'🌎 Latin America',opts:['MX','SA','BA','SN','LIM']},
    {g:'🇬🇧 United Kingdom',opts:['LSE','IL']},
    {g:'🇩🇪 Germany',opts:['XETRA','F','STU','DU','BE','MU','HM','HA']},
    {g:'🇱🇺 Luxembourg',opts:['LU']}, {g:'🇮🇪 Ireland',opts:['IR']},
    {g:'🇫🇷 France',opts:['PA']}, {g:'🇳🇱 Netherlands',opts:['AS']}, {g:'🇧🇪 Belgium',opts:['BR']},
    {g:'🇵🇹 Portugal',opts:['LS']}, {g:'🇨🇭 Switzerland',opts:['SW']}, {g:'🇪🇸 Spain',opts:['MC']},
    {g:'🇦🇹 Austria',opts:['VI']}, {g:'🇬🇷 Greece',opts:['AT']},
    {g:'🇸🇪 Scandinavia',opts:['ST','OL','CO','HE']},
    {g:'🇵🇱 Eastern Europe',opts:['WAR','PR','BUD','RO','ZSE']},
    {g:'🇷🇺 Russia',opts:['MCX']}, {g:'🇹🇷 Turkey',opts:['IS']}, {g:'🇮🇱 Israel',opts:['TA']},
    {g:'🇿🇦 Africa',opts:['JSE','EGX','BC','XNAI','XZIM','XBOT','LUSE','GSE','USE','RSE','DSE','SEM','MSE','XNSA']},
    {g:'🇭🇰 Hong Kong',opts:['HK']}, {g:'🇨🇳 China',opts:['SHG','SHE']},
    {g:'🇰🇷 Korea',opts:['KO','KQ']}, {g:'🇮🇳 India',opts:['NSE']}, {g:'🇵🇰 Pakistan',opts:['KAR']},
    {g:'🇱🇰 Sri Lanka',opts:['CM']},
    {g:'🇸🇬 Southeast Asia',opts:['KLSE','BK','JK','VN','PSE']},
    {g:'🇹🇼 Taiwan',opts:['TW','TWO']}, {g:'🇦🇺 Australia',opts:['AU']},
  ];

  function buildExchangeSelect(){
    document.getElementById('exchangeSelect').innerHTML = '<option value="">— Select Market —</option>' +
      EXCHANGES.map(g=>`<optgroup label="${g.g}">${g.opts.map(o=>`<option value="${o}">${o}</option>`).join('')}</optgroup>`).join('');
  }

  let currentList = [];
  async function onExchangeChange(){
    const ex = document.getElementById('exchangeSelect').value;
    document.getElementById('searchInput').value='';
    if(!ex){ currentList=[]; renderPicker(); return; }
    await loadCache();
    currentList = (summaryByExchange.get(ex)||[]).slice().sort((a,b)=>b.yieldPct-a.yieldPct);
    renderPicker();
  }

  function renderPicker(){
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('pickerList');
    const rows = currentList.filter(r=>!q || r.fullSymbol.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
    if(!rows.length){ list.innerHTML = '<div class="picker-empty">No matches. Pick an exchange or adjust your search.</div>'; return; }
    list.innerHTML = rows.slice(0,300).map(r=>`
      <div class="picker-item" onclick="selectSymbol('${r.fullSymbol}')">
        <span class="sym">${r.fullSymbol}</span> — ${r.yieldPct.toFixed(2)}%
        <span class="nm">${r.name}</span>
      </div>`).join('');
  }

  function mean(arr){ return arr.reduce((s,v)=>s+v,0)/arr.length; }
  function stddev(arr, m){ return Math.sqrt(arr.reduce((s,v)=>s+(v-m)*(v-m),0)/arr.length); }

  async function selectSymbol(fullSymbol){
    await loadCache();
    const summaryRow = [...summaryByExchange.values()].flat().find(r=>r.fullSymbol===fullSymbol);
    const history = (historyBySymbol.get(fullSymbol)||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
    if(!summaryRow || !history.length){
      document.getElementById('mainPanel').innerHTML = '<div class="welcome">No cached data for this symbol.</div>';
      return;
    }

    // Only payments where we have a resolved historical price count toward the distribution.
    // Implausible single points (>50% implied yield -- stale/corrupt cached price)
    // are excluded too: validated via live testing that a single such point can
    // massively skew this mean/stddev and thus the Z-Score for the whole symbol.
    let priced = history.filter(h=>h.pctOfPrice!=null && h.price>0 && h.pctOfPrice<=50);
    // Second, independent artifact class: an isolated price SPIKE/DIP vs.
    // both chronological neighbors produces a normal-looking pctOfPrice
    // (so the filter above misses it) but would still skew this Z-Score.
    priced = priced.filter((h,i,arr)=>{
      if(i===0 || i===arr.length-1) return true;
      const prev=arr[i-1].price, cur=h.price, next=arr[i+1].price;
      if(!(prev>0) || !(next>0)) return true;
      return !((cur>prev*5 && cur>next*5) || (cur<prev/5 && cur<next/5));
    });
    const yields = priced.map(h=>h.pctOfPrice);
    const m = yields.length ? mean(yields) : 0;
    const sd = yields.length ? stddev(yields, m) : 0;
    const latest = priced.length ? priced[priced.length-1] : null;
    const zScore = (latest && sd>0) ? (latest.pctOfPrice - m)/sd : null;

    const fmt=n=>{ const v=parseFloat(n); return isNaN(v)?'—':(v<0.01?v.toFixed(6):v.toFixed(2)); };

    document.getElementById('mainPanel').innerHTML = `
      <div class="analysis-title">${summaryRow.fullSymbol} — ${summaryRow.name}</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="lbl">Trailing Yield</div><div class="val" style="color:var(--green)">${summaryRow.yieldPct.toFixed(2)}%</div></div>
        <div class="stat-box"><div class="lbl">Current Price</div><div class="val">${summaryRow.price?fmt(summaryRow.price):'—'}</div></div>
        <div class="stat-box"><div class="lbl">Hist. Ø Payment Yield</div><div class="val">${m.toFixed(2)}%</div></div>
        <div class="stat-box"><div class="lbl">Std. Deviation</div><div class="val">${sd.toFixed(2)}%</div></div>
        <div class="stat-box"><div class="lbl">Z-Score (latest)</div><div class="val ${zScore>0?'up':zScore<0?'down':''}">${zScore!=null?(zScore>0?'+':'')+zScore.toFixed(2)+'σ':'—'}</div></div>
        <div class="stat-box"><div class="lbl">Streak</div><div class="val">${summaryRow.streakYears}y ${summaryRow.streakDir}</div></div>
      </div>

      <div class="panel-block">
        <h3>1+3 · Yield-Band &amp; Mean-Reversion Over Time</h3>
        <div class="chart-wrap"><canvas id="bandChart"></canvas></div>
        <p class="note" style="color:var(--gold);font-weight:600">${zScore==null?'':(zScore>1?`Letzte Zahlung liegt ${zScore.toFixed(2)}σ ÜBER dem eigenen Durchschnitt — der Kurs war relativ zur Dividende historisch günstig zu diesem Zeitpunkt.`:zScore<-1?`Letzte Zahlung liegt ${Math.abs(zScore).toFixed(2)}σ UNTER dem eigenen Durchschnitt — der Kurs war relativ zur Dividende historisch teuer zu diesem Zeitpunkt.`:`Letzte Zahlung liegt im normalen Bereich (${zScore.toFixed(2)}σ) — nichts Auffälliges gegenüber der eigenen Historie.`)}</p>
        <p class="note">Grüner Korridor = normaler Bereich (±1σ), roter Rand = ungewöhnlich (±2σ), goldene Linie = historischer Durchschnitt. Jeder Punkt ist eine einzelne echte Zahlung (Betrag ÷ Kurs an genau dem Tag). Rein selbstreferenziell — vergleicht die Aktie nur mit ihrer eigenen Vergangenheit, nicht mit anderen Aktien.</p>
      </div>

      <div class="panel-block">
        <h3>20 · Price vs. Dividend Scatter</h3>
        <div class="chart-wrap"><canvas id="scatterChart"></canvas></div>
        <p class="note" id="scatterTakeaway" style="color:var(--gold);font-weight:600"></p>
        <p class="note">Every historical payment plotted as (price on that date, resulting yield%). The gold dashed line is the trend across all points. Where the cloud sits furthest left/up is where this stock was, historically, "on sale" relative to its payout.</p>
      </div>

      <div class="panel-block">
        <h3>4 · Yield-on-Cost Calculator</h3>
        <div class="yoc-controls">
          <div>
            <span class="field-label">Hypothetical buy date (real historical price)</span>
            <select id="yocDateSelect"></select>
          </div>
          <button class="btn" onclick="computeYoC('${fullSymbol}')">CALCULATE</button>
        </div>
        <div class="yoc-result" id="yocResult"></div>
        <p class="note">Uses the real, cached price on that exact historical payment date as your hypothetical cost basis, and today's trailing-12-month dividend rate as the payout — showing why buying cheaper mechanically raises your personal yield, even if the company's payout never changes.</p>
      </div>
    `;

    // Populate YoC date picker with real dated, priced entries (most recent first).
    const yocSel = document.getElementById('yocDateSelect');
    yocSel.innerHTML = priced.slice().reverse().map(h=>`<option value="${h.date}">${h.date} — price ${fmt(h.price)}</option>`).join('');

    renderBandChart(priced, m, sd);
    renderScatterChart(priced);
  }

  let bandChartInstance=null, scatterChartInstance=null;

  function renderBandChart(priced, m, sd){
    const ctx = document.getElementById('bandChart').getContext('2d');
    if(bandChartInstance) bandChartInstance.destroy();
    const labels = priced.map(h=>h.date);
    const lower2 = labels.map(()=>Math.max(0,m-2*sd));
    const upper2 = labels.map(()=>m+2*sd);
    const lower1 = labels.map(()=>Math.max(0,m-sd));
    const upper1 = labels.map(()=>m+sd);
    const meanLine = labels.map(()=>m);
    // Two shaded bands, wide (2σ, red-tinted "unusual") drawn first, then a
    // narrower one (1σ, green-tinted "normal range") drawn on top — reads
    // like a traffic-light corridor instead of a pile of thin dashed lines.
    bandChartInstance = new Chart(ctx, {
      type:'line',
      data:{ labels, datasets:[
        { label:'-2σ', data: lower2, borderColor:'rgba(255,59,92,0.35)', borderWidth:1, borderDash:[2,3], pointRadius:0, fill:false },
        { label:'±2σ (unusual)', data: upper2, borderColor:'rgba(255,59,92,0.35)', borderWidth:1, borderDash:[2,3], pointRadius:0, fill:'-1', backgroundColor:'rgba(255,59,92,0.08)' },
        { label:'-1σ', data: lower1, borderColor:'rgba(0,255,136,0.6)', borderWidth:1, pointRadius:0, fill:false },
        { label:'±1σ (normal range)', data: upper1, borderColor:'rgba(0,255,136,0.6)', borderWidth:1, pointRadius:0, fill:'-1', backgroundColor:'rgba(0,255,136,0.18)' },
        { label:'Historical mean', data: meanLine, borderColor:'#f0c040', borderDash:[7,4], borderWidth:2, pointRadius:0, fill:false },
        { label:'Payment yield %', data: priced.map(h=>h.pctOfPrice), borderColor:'#00d4ff', backgroundColor:'#00d4ff', pointRadius:5, pointHoverRadius:8, pointBorderColor:'#fff', pointBorderWidth:1, showLine:false },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:true, position:'bottom', labels:{ color:'#7d92a8', font:{family:'Space Mono',size:9}, boxWidth:10, padding:8 } },
          tooltip:{ callbacks:{ label:c=> c.datasetIndex===5 ? `Payment: ${c.parsed.y.toFixed(2)}%` : null, filter:c=>c.datasetIndex===5 } } },
        scales:{ x:{ ticks:{ color:'#7d92a8', font:{family:'Space Mono',size:8}, maxTicksLimit:8, maxRotation:0 }, grid:{ display:false } },
                 y:{ ticks:{ color:'#7d92a8', font:{family:'Space Mono',size:9}, callback:v=>v+'%' }, grid:{ color:'rgba(125,146,168,0.15)' } } }
      }
    });
  }

  function linearRegression(points){
    const n = points.length;
    const sumX = points.reduce((s,p)=>s+p.x,0), sumY = points.reduce((s,p)=>s+p.y,0);
    const sumXY = points.reduce((s,p)=>s+p.x*p.y,0), sumXX = points.reduce((s,p)=>s+p.x*p.x,0);
    const denom = n*sumXX - sumX*sumX;
    if(denom===0) return null;
    const slope = (n*sumXY - sumX*sumY)/denom;
    const intercept = (sumY - slope*sumX)/n;
    return {slope, intercept};
  }

  function renderScatterChart(priced){
    const ctx = document.getElementById('scatterChart').getContext('2d');
    if(scatterChartInstance) scatterChartInstance.destroy();
    const pts = priced.map(h=>({x:h.price, y:h.pctOfPrice, d:h.date}));
    const reg = linearRegression(pts);
    const xs = pts.map(p=>p.x);
    const trendLine = reg ? [{x:Math.min(...xs), y:reg.slope*Math.min(...xs)+reg.intercept}, {x:Math.max(...xs), y:reg.slope*Math.max(...xs)+reg.intercept}] : [];
    scatterChartInstance = new Chart(ctx, {
      type:'scatter',
      data:{ datasets:[
        { label:'Trend', data: trendLine, type:'line', borderColor:'#f0c040', borderWidth:2, borderDash:[6,3], pointRadius:0, fill:false, order:1 },
        { label:'Each historical payment', data: pts, backgroundColor:'rgba(0,212,255,0.75)', pointRadius:6, pointHoverRadius:9, order:2 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:true, position:'bottom', labels:{ color:'#7d92a8', font:{family:'Space Mono',size:9}, boxWidth:10 } },
          tooltip:{ callbacks:{ label:c=> c.raw.d ? `${c.raw.d}: price ${c.raw.x.toFixed(2)}, yield ${c.raw.y.toFixed(2)}%` : '' } } },
        scales:{
          x:{ title:{display:true,text:'← cheaper price on that date          Price          more expensive →',color:'#7d92a8',font:{family:'Space Mono',size:9}}, ticks:{ color:'#7d92a8', font:{family:'Space Mono',size:9} }, grid:{ color:'rgba(125,146,168,0.15)' } },
          y:{ title:{display:true,text:'Yield that payment produced (%)',color:'#7d92a8',font:{family:'Space Mono',size:9}}, ticks:{ color:'#7d92a8', font:{family:'Space Mono',size:9} }, grid:{ color:'rgba(125,146,168,0.15)' } }
        }
      }
    });
    const takeaway = document.getElementById('scatterTakeaway');
    if(takeaway){
      if(reg && reg.slope<0) takeaway.textContent = `Trend zeigt nach unten-rechts: je höher der Kurs an einem Zahltag war, desto niedriger die daraus resultierende Rendite — genau das erwartete Verhalten. Punkte links oben = historisch günstigste Kaufgelegenheiten relativ zur Ausschüttung.`;
      else if(reg) takeaway.textContent = `Trend ist hier untypisch flach/steigend — bei dieser Aktie hat der Einstandskurs historisch weniger Einfluss auf die Rendite gehabt als üblich (z.B. weil die Dividende selbst stark schwankt).`;
      else takeaway.textContent = '';
    }
  }

  function computeYoC(fullSymbol){
    const summaryRow = [...summaryByExchange.values()].flat().find(r=>r.fullSymbol===fullSymbol);
    const history = (historyBySymbol.get(fullSymbol)||[]);
    const buyDate = document.getElementById('yocDateSelect').value;
    const entry = history.find(h=>h.date===buyDate);
    if(!entry || !entry.price){ document.getElementById('yocResult').innerHTML = '<div class="stat-box"><div class="lbl">Error</div><div class="val down">No price for that date</div></div>'; return; }
    if(entry.pctOfPrice!=null && entry.pctOfPrice>50){ document.getElementById('yocResult').innerHTML = '<div class="stat-box" style="grid-column:1/-1"><div class="lbl" style="color:var(--down)">Unzuverlässiger Kurs an diesem Datum</div><div class="val" style="font-size:13px;font-weight:400">Historischer Kurs an diesem Zahltag ist unplausibel (impliziert &gt;50% Einzelrendite) — stale/Near-Null-Kurs in der Quelle. Yield-on-Cost würde hier eine falsche Zahl liefern.</div></div>'; return; }

    const oneYearAgo = Date.now()-365*86400000;
    const trailingSum = history.filter(h=>new Date(h.date).getTime()>=oneYearAgo).reduce((s,h)=>s+h.value,0);
    const yieldOnCost = trailingSum>0 ? (trailingSum/entry.price*100) : 0;
    const fmt=n=>{ const v=parseFloat(n); return isNaN(v)?'—':(v<0.01?v.toFixed(6):v.toFixed(2)); };

    document.getElementById('yocResult').innerHTML = `
      <div class="stat-box"><div class="lbl">Buy Date</div><div class="val">${buyDate}</div></div>
      <div class="stat-box"><div class="lbl">Hypothetical Cost</div><div class="val">${fmt(entry.price)}</div></div>
      <div class="stat-box"><div class="lbl">Today's Trailing Dividend</div><div class="val">${fmt(trailingSum)}</div></div>
      <div class="stat-box"><div class="lbl">Yield on THAT Cost</div><div class="val up">${yieldOnCost.toFixed(2)}%</div></div>
    `;
  }

  buildExchangeSelect();
</script>
</body>
</html>
